name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build both companions
        run: |
          VERSION=$(cat VERSION)
          case "$GITHUB_REF" in refs/tags/v*) VERSION=${GITHUB_REF#refs/tags/v};; esac
          ./build.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dsmod
          path: dist/*.dsmod.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dsmod.zip
          body_path: CHANGELOG.md
